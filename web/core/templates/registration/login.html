{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar – PsiAgenda</title>
  <link href="{% static 'core/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'core/psiagenda.css' %}" rel="stylesheet">
</head>
<body>
<main class="pa-login-bg">
  <div class="pa-login-card">
    <div class="text-center mb-4">
      <span class="pa-logo mx-auto mb-3" style="width:64px;height:64px;font-size:2rem;border-radius:18px" aria-hidden="true">Ψ</span>
      <h1 class="pa-page-title">PsiAgenda</h1>
      <p class="pa-subtitle">Agenda, pacientes e financeiro do seu consultório</p>
    </div>
    <div class="pa-card"><div class="pa-card-body p-4">
      {% if form.errors %}<div class="alert alert-danger" role="alert">⚠ {% if form.non_field_errors %}{{ form.non_field_errors.0 }}{% else %}Usuário ou senha inválidos.{% endif %}</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <label class="form-label" for="id_username">Usuário</label>
        <input class="form-control mb-3" type="text" name="username" id="id_username" autocomplete="username" required autofocus>
        <label class="form-label" for="id_password">Senha</label>
        <input class="form-control mb-4" type="password" name="password" id="id_password" autocomplete="current-password" required>
        <button class="btn btn-primary w-100 py-2">Entrar</button>
      </form>
    </div></div>
  </div>
</main>
</body>
</html>
