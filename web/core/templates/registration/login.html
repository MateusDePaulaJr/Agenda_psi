{% extends "core/base.html" %}
{% block title %}Entrar – PsiAgenda{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h1 class="h3 my-4 text-center">PsiAgenda</h1>
  {% if form.errors %}<div class="alert alert-danger" role="alert">⚠ Usuário ou senha inválidos.</div>{% endif %}
  <form method="post" class="card card-body">
    {% csrf_token %}
    <label class="form-label fw-bold" for="id_username">Usuário</label>
    <input class="form-control mb-3" type="text" name="username" id="id_username" required autofocus>
    <label class="form-label fw-bold" for="id_password">Senha</label>
    <input class="form-control mb-3" type="password" name="password" id="id_password" required>
    <button class="btn btn-primary w-100">Entrar</button>
  </form>
</div></div>
{% endblock %}
