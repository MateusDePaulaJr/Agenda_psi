{% for campo in form %}
  <div class="mb-3" id="campo-{{ campo.name }}">
    <label class="form-label fw-bold" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
    {% for erro in campo.errors %}<div class="text-danger mt-1" role="alert">⚠ {{ erro }}</div>{% endfor %}
  </div>
{% endfor %}
{% for erro in form.non_field_errors %}<div class="alert alert-danger" role="alert">⚠ {{ erro }}</div>{% endfor %}
